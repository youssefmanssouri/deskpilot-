name: Installer smoke test

# Builds the MSI, installs it on a fresh Windows machine, starts DeskPilot, checks it keeps
# running, then uninstalls and checks nothing is left behind. A release build takes a
# while, so this runs on pushes to main, on demand, and only on pull requests that change
# the installer, its build config, or this test.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/installer-smoke-test.yml'
      - 'scripts/smoke-test-installer.ps1'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/capabilities/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Install, run, uninstall (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build MSI
        run: npm run tauri -- build --bundles msi -- --locked

      - name: Smoke test the installer
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -LogDir "${{ github.workspace }}/smoke-logs"

      - name: Upload msiexec logs on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: installer-smoke-logs
          path: ${{ github.workspace }}/smoke-logs
          retention-days: 7
